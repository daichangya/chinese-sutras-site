- id: ullambana
  name: 盂兰盆节（佛欢喜日）
  lunarMonth: 7
  lunarDay: 15
  tier: major
  aiTheme: 盂兰盆报恩节，供僧孝亲，超荐七世父母，圆满孝道功德
  searchHints:
    - 盂兰盆
    - 目连救母
    - 孝道报恩
  relatedSutras:
