- id: medicine-buddha
  name: 药师佛圣诞
  lunarMonth: 9
  lunarDay: 30
  tier: major
  aiTheme: 药师圣诞，十二大愿护佑众生消灾祛病、身心安乐、福寿绵长
  searchHints:
    - 药师佛
    - 消灾延寿
    - 十二大愿
  relatedSutras:
    - yaoshi-jing

- id: amitabha-birthday
  name: 阿弥陀佛圣诞
  lunarMonth: 11
  lunarDay: 17
  tier: major
  aiTheme: 弥陀圣诞，四十八宏大愿力接引众生往生西方极乐净土
  searchHints:
    - 阿弥陀佛
    - 极乐净土
    - 发愿往生
  relatedSutras:
    - amituo-jing

- id: buddha-enlightenment
  name: 释迦牟尼佛成道日（腊八）
  lunarMonth: 12
  lunarDay: 8
  tier: major
  aiTheme: 成道纪念日，菩提树下睹星开悟，证得无上正等正觉
  searchHints:
    - 成道
    - 觉悟
    - 菩提树下悟道
  relatedSutras:
    - fo-benxing-jing

