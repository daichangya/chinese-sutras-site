# 汉传佛教节日（农历月日）
# major：触发今日经句联动；须含 aiTheme + searchHints；verseOverride 可选
# minor：仅月历标注
# relatedSutras 经目编码见 lib/calendar/festival-sutras.ts（友好 slug → CBETA）
# 备注：七月三十地藏圣诞、九月三十药师圣诞逢小月无三十，寺院多顺延至二十九举行

# --- major 核心联动节日 ---
- id: buddha-leave-home
  name: 释迦牟尼佛出家日
  lunarMonth: 2
  lunarDay: 8
  tier: major
  aiTheme: 佛出家纪念日，舍弃王宫荣华，发起求解脱、度众生之大愿
  searchHints:
    - 佛陀出家
    - 舍弃王位修行
    - 发菩提心
  relatedSutras:
    - fo-benxing-jing

- id: buddha-parinirvana
