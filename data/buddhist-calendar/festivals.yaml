  lunarMonth: 2
  lunarDay: 15
  tier: major
  aiTheme: 涅槃日，示现世间无常，法身不灭常住十方
  searchHints:
    - 涅槃
    - 无常
    - 法身常住
  relatedSutras:
    - niepan-jing

- id: guanyin-birthday
