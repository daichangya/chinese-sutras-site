  lunarMonth: 4
  lunarDay: 8
  tier: major
  aiTheme: 浴佛节，佛陀降生，彰显一切众生本自具足清净佛性
  searchHints:
    - 浴佛
    - 本具佛性
    - 一切众生皆有佛性
  relatedSutras:
